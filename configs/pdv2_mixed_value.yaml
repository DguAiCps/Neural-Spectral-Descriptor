# 결과를 보기 전에 선형 비중 1/2과 여섯 대조군을 고정한다.
pilot_seed: 1
arms: [diff_linear, standard_linear, diff_tanh, standard_tanh, diff_mixed, standard_mixed]
train_arms: [diff_mixed, standard_mixed]
reused_arms: {diff_linear: diff_linear, standard_linear: standard_linear, diff_tanh: diff_tanh, standard_tanh: standard_tanh}
candidate_arms: [diff_mixed]
reference: point
epochs: 20
checkpoint_epochs: [10, 20]
updates_per_epoch: 45
relation_key: tanh_after_projection
value_linear_weight: 0.5
loss: original_infonce_without_geographic_negative_mask
final_score: arc_unique_b100
selection: validation_final_ap
promotion:
  ap_gain_min: 0.001
  f1_loss_max: 0.001
  r100_loss_max: 0.001
  family_ap_loss_max: 0.0025
  comparators: [diff_linear, standard_linear, diff_tanh, standard_tanh, matched_standard, point]
expansion_seeds: [2, 3]
expansion: candidate_and_all_six_controls
test_used: false
