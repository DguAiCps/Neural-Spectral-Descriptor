# 후보 선택을 유지한 점수 수정. 결과를 보기 전에 모든 조건을 고정한다.
seeds: [1, 2, 3]
models: [standard, capacity_point]
arms: [baseline, hard_null, forced, baseline_score, soft_null, capped, soft_capped]
primary_model: standard
primary_arm: soft_capped
soft_attenuation: exp_min_null_margin_zero
score_cap: original_winner_final_score
final_score_source: arc_unique_b100
promotion:
  comparators: [forced, hard_null]
  ap_gain_min: 0.001
  r100_loss_max: 0.001
  family_ap_loss_max: 0.0025
  require_each_seed: true
test_used: false
