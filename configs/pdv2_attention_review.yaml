# 재학습/설정 선택이 아닌 동결 모델의 attention 의존성 진단.
seed: 1
source_arm: diff_tanh
source_epoch: 20
arms: [full, content, geometry, uniform]
checkpoint_selection: reused_validation_ap_choice
layers_intervened: [0, 1]
content_score: query_dot_tanh_projected_difference
geometry_score: existing_edge_encoder_and_bias_mlp
value: existing_tanh_projected_difference
train: false
test_used: false
final_score: arc_unique_b100
promotion: none_inference_interventions_only
attention_centers_per_graph: 512
attention_degree: 10
diagnostic_models: [original_diff, diff_linear, diff_tanh, diff_mixed, standard_linear]
