# 키·값 투영은 고정하고 가중치를 공유하는 채널 수만 32→4로 줄인다.
pilot_seed: 1
arms:
- diff_linear
- standard_linear
- diff_grouped
- standard_grouped
train_arms:
- diff_grouped
- standard_grouped
reused_arms:
  diff_linear: diff_tanh
  standard_linear: standard_tanh
candidate_arms:
- diff_grouped
reference: point
epochs: 20
checkpoint_epochs:
- 10
- 20
updates_per_epoch: 45
relation_key: tanh_after_projection
loss: original_infonce_without_geographic_negative_mask
final_score: arc_unique_b100
selection: validation_final_ap
promotion:
  ap_gain_min: 0.001
  f1_loss_max: 0.001
  r100_loss_max: 0.001
  family_ap_loss_max: 0.0025
  comparators:
  - diff_linear
  - standard_linear
  - matched_standard
  - point
expansion_seeds:
- 2
- 3
expansion: best_eligible_candidate_and_diff_linear_standard_linear_matched_standard_point
test_used: false
groups_per_head:
  linear: 1
  grouped: 8
value_nonlinearity: none
attention: same_128_channels_in_32_groups_of_4
