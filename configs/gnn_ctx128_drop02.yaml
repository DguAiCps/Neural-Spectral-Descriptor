data:
  cache_dir: data/preprocessed
  datasets:
    test:
    - root: /workspace/data/kitti/dataset
      sequences:
      - 09
      - '10'
      type: kitti
      weight: 1.0
    train:
    - root: /workspace/data/helipr
      sequences:
      - Town02
      - Town03
      - Roundabout01
      - Roundabout02
      - Roundabout03
      - Bridge01
      - Bridge02
      - Bridge03
      - Bridge04
      - KAIST04
      - KAIST05
      - KAIST06
      - DCC04
      - DCC05
      - DCC06
      - Riverside04
      - Riverside05
      - Riverside06
      type: helipr
      weight: 1.0
    - root: /workspace/data/kitti/dataset
      sequences:
      - '02'
      - '06'
      - '07'
      type: kitti
      weight: 1.0
    - root: /workspace/data/nclt
      sequences:
      - '2012-05-11'
      - '2012-08-04'
      - '2012-11-04'
      type: nclt
      weight: 1.0
    - root: /workspace/data/mulran
      sequences:
      - DCC01
      - DCC02
      - KAIST01
      - KAIST02
      - Riverside01
      - Riverside02
      - Sejong01
      - Sejong02
      type: mulran
      weight: 1.0
    val:
    - root: /workspace/data/kitti/dataset
      sequences:
      - '00'
      - '05'
      - 08
      type: kitti
      weight: 1.0
    - root: /workspace/data/nclt
      sequences:
      - '2012-01-08'
      - '2013-01-10'
      type: nclt
      weight: 1.0
    - root: /workspace/data/helipr
      sequences:
      - Town01
      type: helipr
      weight: 1.0
    - root: /workspace/data/mulran
      sequences:
      - DCC03
      - KAIST03
      - Riverside03
      type: mulran
      weight: 1.0
  lazy_load: true
encoding:
  alpha: 2.0
  bev:
    height_encoding: iris
    n_height_layers: 8
    z_max: 5.0
    z_min: -3.0
  bin_statistics:
  - mean
  - std
  binning_strategy: octave
  descriptor_size: 416
  elevation_range:
  - -24.8
  - 2.0
  epsilon: 1.0e-08
  inter_bin_statistics:
  - diff
  learnable_alpha: true
  log_magnitude: false
  max_range: 80.0
  min_range: 1.0
  n_azimuth: 360
  n_bins: 16
  n_elevation: 16
  normalize_channels: false
  projection_type: range_image
  quantization_bits: 16
  sensor_elevation_ranges:
    helipr:
    - -15.0
    - 15.0
    kitti:
    - -24.8
    - 2.0
    mulran:
    - -16.6
    - 16.6
    nclt:
    - -30.67
    - 10.67
  spectral_policy:
    enabled: true
    lr_scale: 0.1
    output_dim: 416
    shared_across_rings: false
    soft_binning:
      alpha: 2.0
      init_mode: octave
      inter_ring:
        channels: 8
        enabled: true
        kernel_size: 3
      inter_stats: []
      n_soft_bins: 9
      stats:
      - mean
      - std
    type: soft_binning
    warmup_epochs: 3
  target_elevation_bins: 16
  zero_center: false
gnn:
  context_dim: 128
  dropout: 0.2
  edge_encoding:
    d_edge: 32
    d_rot_encode: 16
    d_type_embed: 16
    dropout: 0.1
    n_edge_types: 2
  hidden_dim: 128
  input_dim: 416
  local_update_hops: 3
  n_heads: 4
  n_layers: 2
  patience: 10
  residual: true
  use_local_updates: true
  use_multi_gpu: false
keyframe:
  distance_threshold: 0.8
  freeze_old_embeddings: true
  graph:
    base_prior: 0.01
    confidence_level: 0.9
    density_beta: 10.0
    density_k: 50
    edge_method: bayesian
    multiscale_min_consistency: 0.0
    prior_signal: density
    similarity_exclude_temporal: true
    similarity_max_k: 10
    similarity_metric: l2
    similarity_threshold: 0.993
  max_active_nodes: 1000
  max_keyframes: 10000000
  overlap_threshold: 0.65
  rotation_threshold: 20.0
  temporal_neighbors: 10
  temporal_threshold: 30.0
  voxel_size: 0.2
logging:
  log_interval: 10
  save_interval: 1000
  use_wandb: false
  wandb_entity: null
  wandb_project: neural-spectral-codec-multi
retrieval:
  context_window: 10
  icp_fitness_threshold: 0.3
  icp_max_iterations: 30
  icp_rmse_threshold: 0.5
  spatial_filter_distance: 50.0
  top_k: 10
  use_wasserstein: true
  verification_method: gicp
  voxel_downsample: 0.3
system:
  checkpoint_dir: results/bin_benchmark_20260410_025718/ir_conv_k8/checkpoints
  device: cuda
  log_dir: results/bin_benchmark_20260410_025718/ir_conv_k8/logs
  num_workers: 4
  output_dir: outputs
  seed: 42
training:
  learning_rate: 0.0005
  log_interval: 10
  mine_every_n_epochs: 5
  n_epochs: 100
  temperature: 0.1
  use_amp: true
  validate_every_n_epochs: 3
  weight_decay: 1.0e-05
triplet:
  min_temporal_distance: 30
  n_triplets_per_anchor: 3
  negative_distance_min: 10.0
  positive_distance_max: 5.0
