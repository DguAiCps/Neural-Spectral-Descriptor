# 최종 검증을 보기 전에 고정하는 시간 전용 차이 모델의 학습 손실 2x2 대조.
seed: 1
arms: [rank_all, rank_filtered, rank_guarded, rank_filtered_guarded]
initial_model: interaction
initial_epoch: 20
encoder_preset: no_interdiff
use_gated_context: true
gate_initial_alpha: 0.0625
epochs: 4
checkpoint_epochs: [2, 4]
batch_queries: 512
learning_rate: 0.00005
weight_decay: 0.00001
gradient_clip: 1.0
temperature: 0.1
margin_cap: 0.1
guard_coefficient: 1.0
training_mode: float32_eval_frozen_bn_no_dropout
candidate_mode: fixed_initial_actual_top100_union_aux100
final_score: arc_unique_b100
checkpoint_selection: validation_final_AP_then_earlier_epoch
promotion:
  ap_gain_min: 0.001
  f1_loss_max: 0.001
  r100_loss_max: 0.001
  family_ap_loss_max: 0.0025
test_used: false
scope: one_seed_training_objective_pilot_no_new_inference_parameters
