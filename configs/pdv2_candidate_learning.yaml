# 최종 후보 순위와 수락·거절을 학습하는 검증 전용 예비 실험.
seed: 1
encoder_preset: no_interdiff
use_gated_context: true
gate_initial_alpha: 0.0625
arms: [gnn_head, gnn_joint, point_head, point_joint]
epochs: 12
checkpoint_epochs: [4, 8, 12]
candidate_refresh_epochs: [1, 5, 9]
queries_per_class_per_sequence: 1024
batch_queries: 64
queries_per_forward: 256
encoder_learning_rate: 0.00005
head_learning_rate: 0.001
weight_decay: 0.00001
pair_bce_weight: 0.5
gradient_clip: 1.0
head_hidden: [32, 16]
lag: 15
past_gap: 30
pool_per_index: 100
positive_distance: 5.0
negative_query_distance: 25.0
initial_gnn: checkpoints/pdv2_matching_s1_gnn_original/checkpoint_epoch_10.pth
initial_point: checkpoints/pdv2_matching_s1_point_original/checkpoint_epoch_10.pth
scope: pilot_validation_only
