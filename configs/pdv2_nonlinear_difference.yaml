# 비선형 관계 키의 2x2 연산 대조. 신규성 확증이 아닌 첫 원인 분리 실험.
pilot_seed: 1
arms: [diff, standard, diff_tanh, standard_tanh, point]
primary: diff_tanh
epochs: 20
checkpoint_epochs: [10, 20]
updates_per_epoch: 45
relation_nonlinearity: tanh_after_key_projection
value_nonlinearity: none
final_score: arc_unique_b100
selection: validation_final_ap
promotion:
  comparators: [diff, standard, standard_tanh, point]
  ap_gain_min: 0.001
  r100_loss_max: 0.001
  family_ap_loss_max: 0.0025
test_used: false
